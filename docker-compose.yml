services:

  patientdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mediscreen-patientdb

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Mediscreen123!"

    ports:
      - "1433:1433"

    volumes:
      - patientdb_data:/var/opt/mssql


  mongodb:
    image: mongo:8.0
    container_name: mediscreen-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db


  patientservice:
    image: mediscreen-patientservice
    container_name: mediscreen-patientservice

    build:
      context: .
      dockerfile: PatientService/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=patientdb,1433;Database=MediscreenPatientDb;User Id=sa;Password=Mediscreen123!;TrustServerCertificate=True;"

    ports:
      - "8080:8080"

    depends_on:
      - patientdb


  noteservice:
    image: mediscreen-noteservice
    container_name: mediscreen-noteservice

    build:
      context: .
      dockerfile: NoteService/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080

      MongoDb__ConnectionString: "mongodb://mongodb:27017"
      MongoDb__DatabaseName: "MediscreenNotesDb"

    ports:
      - "8083:8080"

    depends_on:
      - mongodb


  riskservice:
    image: mediscreen-riskservice
    container_name: mediscreen-riskservice

    build:
      context: .
      dockerfile: RiskService/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080

      Services__PatientServiceUrl: "http://patientservice:8080/"
      Services__NoteServiceUrl: "http://noteservice:8080/"

    ports:
      - "8084:8080"

    depends_on:
      - patientservice
      - noteservice


  gateway:
    image: mediscreen-gateway
    container_name: mediscreen-gateway

    build:
      context: .
      dockerfile: Gateway/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080

    ports:
      - "8081:8080"

    depends_on:
      - patientservice
      - noteservice
      - riskservice


  frontend:
    image: mediscreen-frontend
    container_name: mediscreen-frontend

    build:
      context: .
      dockerfile: Frontend/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080

      Gateway__BaseUrl: "http://gateway:8080/"

    ports:
      - "8082:8080"

    depends_on:
      - gateway


volumes:
  patientdb_data:
  mongodb_data: